# Builds the app from the tagged source and attaches it to a GitHub release.
# Run by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The release body comes from docs/release-notes-<version>.md (see Releasing in the README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version v$version"
            exit 1
          fi

      - name: Prepare release notes
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 sh scripts/package-app.sh

      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "HSBG Mac Overlay.app" HSBG-Mac-Overlay.zip
          shasum -a 256 HSBG-Mac-Overlay.zip | tee HSBG-Mac-Overlay.zip.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/HSBG-Mac-Overlay.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/HSBG-Mac-Overlay.zip dist/HSBG-Mac-Overlay.zip.sha256 \
            --title "HSBG Mac Overlay $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
